<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시안 A — 단순 직관형</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    line-height: 1.6;
  }
  .phone-frame {
    width: 390px;
    min-height: 844px;
    margin: 40px auto;
    background: #fff;
    border-radius: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    overflow: hidden;
    border: 8px solid #1a1a1a;
  }

  /* 헤더 */
  .header {
    background: #2d5a3d;
    color: #fff;
    padding: 20px 24px 16px;
    text-align: center;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .header .subtitle {
    font-size: 14px;
    opacity: 0.85;
  }

  /* 큰 글씨 토글 */
  .font-toggle {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 10px 24px;
    background: #fff;
    border-bottom: 1px solid #e8e8e8;
    gap: 8px;
  }
  .font-toggle label {
    font-size: 14px;
    color: #555;
  }
  .toggle-switch {
    position: relative;
    width: 48px;
    height: 26px;
    background: #ccc;
    border-radius: 13px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .toggle-switch.on { background: #2d5a3d; }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.3s;
  }
  .toggle-switch.on::after { transform: translateX(22px); }

  /* 메인 영역 */
  .main { padding: 20px 24px; }

  /* 인기 질문 */
  .faq-section {
    margin-bottom: 20px;
  }
  .faq-label {
    font-size: 15px;
    font-weight: 600;
    color: #555;
    margin-bottom: 10px;
  }
  .faq-cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .faq-card {
    background: #f0f7f2;
    border: 2px solid #c8e0d0;
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 17px;
    color: #2d5a3d;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    line-height: 1.5;
  }
  .faq-card:hover {
    background: #2d5a3d;
    color: #fff;
    border-color: #2d5a3d;
  }
  .faq-card:active { transform: scale(0.98); }

  /* 입력 영역 */
  .input-area {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .input-area input {
    flex: 1;
    padding: 16px 18px;
    font-size: 18px;
    border: 2px solid #ddd;
    border-radius: 14px;
    outline: none;
    background: #fafafa;
  }
  .input-area input:focus {
    border-color: #2d5a3d;
    background: #fff;
  }
  .input-area input::placeholder { color: #aaa; }
  .send-btn {
    padding: 16px 24px;
    background: #2d5a3d;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .send-btn:hover { background: #234a30; }
  .send-btn:active { transform: scale(0.97); }

  /* 채팅 영역 */
  .chat-area {
    min-height: 200px;
  }
  .chat-bubble {
    max-width: 85%;
    padding: 16px 20px;
    border-radius: 18px;
    font-size: 18px;
    line-height: 1.7;
    margin-bottom: 12px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .bubble-bot {
    background: #f0f7f2;
    color: #1a1a1a;
    border-bottom-left-radius: 6px;
    margin-right: auto;
  }
  .bubble-user {
    background: #2d5a3d;
    color: #fff;
    border-bottom-right-radius: 6px;
    margin-left: auto;
  }

  /* 듣기 버튼 */
  .tts-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding: 10px 18px;
    background: #e8f5e9;
    border: 2px solid #c8e0d0;
    border-radius: 10px;
    font-size: 16px;
    color: #2d5a3d;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tts-btn:hover { background: #2d5a3d; color: #fff; }

  /* 약한 근거 경고 */
  .weak-warning {
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 15px;
    color: #8d6e00;
    margin-bottom: 12px;
  }

  /* 출처 */
  .sources {
    margin-top: 12px;
    padding: 12px;
    background: #f9f9f6;
    border-radius: 10px;
    border: 1px solid #eee;
  }
  .sources-title {
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
  }
  .source-tag {
    display: inline-block;
    padding: 4px 10px;
    font-size: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    color: #555;
    margin: 2px 4px 2px 0;
    background: #fff;
  }

  /* 피드백 */
  .feedback {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 16px;
    padding: 14px 18px;
    background: #f9f9f6;
    border-radius: 12px;
    font-size: 16px;
    color: #555;
  }
  .feedback button {
    background: none;
    border: 2px solid #ddd;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .feedback button:hover { border-color: #2d5a3d; background: #f0f7f2; }

  /* 판정 */
  .judgement {
    margin-top: 12px;
    padding: 14px;
    background: #f9f9f6;
    border: 1px solid #eee;
    border-radius: 10px;
    font-size: 14px;
  }
  .judgement-title {
    font-weight: 600;
    margin-bottom: 6px;
  }
  .judgement-flags {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .flag { font-size: 13px; }
  .flag-pass { color: #16a34a; }
  .flag-fail { color: #dc2626; }
  .judgement-comment { color: #666; font-size: 13px; }

  /* 큰 글씨 모드 */
  .large-font .faq-card { font-size: 21px; }
  .large-font .input-area input { font-size: 22px; padding: 18px 20px; }
  .large-font .send-btn { font-size: 22px; padding: 18px 28px; }
  .large-font .chat-bubble { font-size: 22px; }
  .large-font .tts-btn { font-size: 19px; }
  .large-font .feedback { font-size: 19px; }
  .large-font .header h1 { font-size: 26px; }

  /* 하단 안내 */
  .footer-note {
    text-align: center;
    padding: 16px;
    font-size: 13px;
    color: #aaa;
    border-top: 1px solid #eee;
  }
</style>
</head>
<body>

<div class="phone-frame" id="app">
  <!-- 헤더 -->
  <div class="header">
    <h1>어르신 디지털 안내</h1>
    <div class="subtitle">궁금한 점을 편하게 물어보세요</div>
  </div>

  <!-- 큰 글씨 토글 -->
  <div class="font-toggle">
    <label>큰 글씨</label>
    <div class="toggle-switch" id="fontToggle" onclick="toggleFont()"></div>
  </div>

  <div class="main">
    <!-- 인기 질문 -->
    <div class="faq-section">
      <div class="faq-label">자주 묻는 질문</div>
      <div class="faq-cards">
        <div class="faq-card" onclick="selectFaq('보이스피싱이 의심되면 어떻게 해야 하나요?')">
          보이스피싱이 의심되면 어떻게 해야 하나요?
        </div>
        <div class="faq-card" onclick="selectFaq('디지털배움터는 어떤 곳인가요?')">
          디지털배움터는 어떤 곳인가요?
        </div>
        <div class="faq-card" onclick="selectFaq('무인민원발급기는 어떻게 사용하나요?')">
          무인민원발급기는 어떻게 사용하나요?
        </div>
      </div>
    </div>

    <!-- 입력 -->
    <div class="input-area">
      <input type="text" id="queryInput" placeholder="질문을 입력하세요" />
      <button class="send-btn" onclick="ask()">질문</button>
    </div>

    <!-- 채팅 -->
    <div class="chat-area" id="chatArea"></div>
  </div>

  <div class="footer-note">시안 A — 단순 직관형</div>
</div>

<script>
  let largeFont = false;

  function toggleFont() {
    largeFont = !largeFont;
    document.getElementById('app').classList.toggle('large-font', largeFont);
    document.getElementById('fontToggle').classList.toggle('on', largeFont);
  }

  function selectFaq(q) {
    document.getElementById('queryInput').value = q;
    ask();
  }

  function ask() {
    const input = document.getElementById('queryInput');
    const q = input.value.trim();
    if (!q) return;

    const chatArea = document.getElementById('chatArea');

    // 사용자 말풍선
    const userBubble = document.createElement('div');
    userBubble.className = 'chat-bubble bubble-user';
    userBubble.textContent = q;
    chatArea.appendChild(userBubble);

    input.value = '';

    // 시뮬레이션 답변
    setTimeout(() => {
      const botBubble = document.createElement('div');
      botBubble.className = 'chat-bubble bubble-bot';
      botBubble.innerHTML = '답변 시뮬레이션입니다. 실제 서비스에서는 RAG 기반으로 정확한 답변이 제공됩니다.';

      const ttsBtn = document.createElement('button');
      ttsBtn.className = 'tts-btn';
      ttsBtn.innerHTML = '&#128266; 듣기';
      ttsBtn.onclick = function() { alert('TTS 기능 — Web Speech API로 음성 재생'); };

      const wrapper = document.createElement('div');
      wrapper.style.maxWidth = '85%';
      wrapper.appendChild(botBubble);
      wrapper.appendChild(ttsBtn);
      chatArea.appendChild(wrapper);

      chatArea.scrollTop = chatArea.scrollHeight;
    }, 500);
  }
</script>

</body>
</html>
